name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t newtab .
      - name: Smoke test
        run: |
          docker run -d --rm -p 8080:80 --name newtab newtab
          sleep 2
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/lit-html.js
          docker stop newtab
